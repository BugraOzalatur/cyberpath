plugins {
    id 'base'
}

def pnpm = rootProject.ext.pnpm
def pathEnv = rootProject.ext.pnpmPathEnv

def pnpmInstall = tasks.register('pnpmInstall', Exec) {
    group = 'build'
    description = 'Installs dependencies from the lockfile.'
    environment 'PATH', pathEnv
    commandLine pnpm, 'install', '--frozen-lockfile'
    inputs.files 'package.json', 'pnpm-lock.yaml'
    outputs.dir 'node_modules'
}

def pnpmBuild = tasks.register('pnpmBuild', Exec) {
    group = 'build'
    description = 'Type-checks and builds the production bundle into dist/.'
    dependsOn pnpmInstall
    environment 'PATH', pathEnv
    commandLine pnpm, 'run', 'build'
    inputs.dir 'src'
    inputs.dir 'public'
    inputs.files 'index.html', 'vite.config.ts', 'tsconfig.json', 'tsconfig.app.json', 'tsconfig.node.json', 'package.json', 'pnpm-lock.yaml'
    outputs.dir 'dist'
}

def lint = tasks.register('lint', Exec) {
    group = 'verification'
    description = 'Lints the sources with oxlint.'
    dependsOn pnpmInstall
    environment 'PATH', pathEnv
    commandLine pnpm, 'run', 'lint'
}

tasks.named('assemble') { dependsOn pnpmBuild }
tasks.named('check') { dependsOn lint }
tasks.named('clean') { delete 'dist' }
