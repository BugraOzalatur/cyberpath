// Root project: cyberpath-api (Spring Boot), cyberpath-ui (React/Vite), cyberpath-mcp (MCP server)
// and cyberpath-assembly (packaging: UI-in-jar, Docker image, distributions). See cyberpath-assembly/build.gradle.
//   ./gradlew build                     → build all modules + tests/lint
//   ./gradlew clean dockerBuild -x test → build, create the Docker image, start the local stack

// Tools are resolved to absolute paths: Gradle daemons started from an IDE often run with a minimal PATH
// (e.g. without /opt/homebrew/bin). Override pnpm with -PpnpmPath=/path/to/pnpm.
def home = System.getProperty('user.home')
def systemPath = (System.getenv('PATH') ?: '').split(File.pathSeparator).toList()
def findTool = { String name, List<String> extraDirs ->
    (systemPath + extraDirs).collect { new File(it, name) }.find { it.canExecute() } ?: new File(name)
}

def pnpmFile = providers.gradleProperty('pnpmPath').map { new File(it) }.getOrElse(
        findTool('pnpm', ['/opt/homebrew/bin', '/usr/local/bin', "${home}/Library/pnpm", "${home}/.local/share/pnpm", "${home}/.volta/bin"]))
def dockerFile = findTool('docker', ['/usr/local/bin', '/opt/homebrew/bin', '/Applications/Docker.app/Contents/Resources/bin'])

ext.pnpm = pnpmFile.path
// pnpm's launcher needs `node`, which normally lives next to it
ext.pnpmPathEnv = ([pnpmFile.parent] + systemPath).findAll { it }.join(File.pathSeparator)
ext.docker = dockerFile.path
// docker compose calls credential helpers that sit next to the docker binary
ext.dockerPathEnv = ([dockerFile.parent] + systemPath).findAll { it }.join(File.pathSeparator)
