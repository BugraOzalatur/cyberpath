spring:
  application:
    name: cyberpath-api
  config:
    # Outside Docker, read the project's .env (from the repo root or from cyberpath-api/). In Docker, compose passes env vars.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5434}/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8095}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5180,http://127.0.0.1:5180}
