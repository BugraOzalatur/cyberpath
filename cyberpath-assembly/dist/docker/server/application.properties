# CyberPath server configuration for the Docker distribution.
# Mounted read-only at /app/config/application.properties.

server.port=8095

# PostgreSQL runs in the "cyberpath-db" container on the compose network
spring.datasource.url=jdbc:postgresql://cyberpath-db:5432/cyberpath
spring.datasource.username=cyberpath
# REQUIRED: set DB_PASSWORD in .env; compose passes it to the container
spring.datasource.password=${DB_PASSWORD}

# Time zone that defines "today" and "this week"
app.timezone=Europe/Istanbul

# The browser reaches the app through the published port on localhost
app.cors.allowed-origins=http://127.0.0.1:5180,http://localhost:5180
