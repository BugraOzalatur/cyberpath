# CyberPath server configuration (service distribution).
# Read from the working directory on start-up; values here override the defaults built into the jar.

# HTTP port of the web UI and the API. Keep the service behind 127.0.0.1 or a reverse proxy:
# CyberPath has no authentication.
server.port=8095
server.address=127.0.0.1

# PostgreSQL 17 database (create it first: createuser cyberpath -P && createdb -O cyberpath cyberpath)
spring.datasource.url=jdbc:postgresql://localhost:5432/cyberpath
spring.datasource.username=cyberpath
# REQUIRED: password of the database user above
spring.datasource.password=

# Time zone that defines "today" and "this week"
app.timezone=Europe/Istanbul

# Origins allowed to call the API from a browser (the UI itself is same-origin)
app.cors.allowed-origins=http://127.0.0.1:8095,http://localhost:8095
