# CyberPath local stack: the server (API + UI) and PostgreSQL.
#   ./gradlew dockerBuild   →  http://127.0.0.1:5180   (API and MCP clients: http://127.0.0.1:5180/api)
# Run through Gradle: it builds the image first and uses the repository root as the compose project directory,
# so the root .env is read (see .env.example). All ports are bound to 127.0.0.1.

name: cyberpath

services:
  cyberpath-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - cyberpath-db:/var/lib/postgresql/data
    networks: [cyberpath]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cyberpath-server:
    image: cyberpath/server:latest
    environment:
      DB_URL: jdbc:postgresql://cyberpath-db:5432/${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      CORS_ORIGINS: http://127.0.0.1:5180,http://localhost:5180
    ports:
      - "127.0.0.1:5180:8095"
    networks: [cyberpath]
    depends_on:
      cyberpath-db:
        condition: service_healthy
    restart: unless-stopped

networks:
  cyberpath:
    driver: bridge

volumes:
  cyberpath-db:
