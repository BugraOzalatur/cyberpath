# CyberPath — cybersecurity learning tracker
#   ./gradlew dockerBuild   →  UI: http://127.0.0.1:5180   API: http://127.0.0.1:8095
# All ports are bound to 127.0.0.1 and are reachable from this machine only.
# Images are built from Gradle outputs (jar / dist), so use ./gradlew dockerBuild instead of docker compose build.
# Configuration comes from .env (git-ignored); see .env.example.

name: cyberpath

services:
  cyberpath-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - cyberpath-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cyberpath-api:
    build: ./cyberpath-api
    environment:
      DB_URL: jdbc:postgresql://cyberpath-db:5432/${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      CORS_ORIGINS: http://127.0.0.1:5180,http://localhost:5180
    ports:
      - "127.0.0.1:8095:8095"
    depends_on:
      cyberpath-db:
        condition: service_healthy
    restart: unless-stopped

  cyberpath-ui:
    build: ./cyberpath-ui
    ports:
      - "127.0.0.1:5180:8080"
    depends_on:
      cyberpath-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cyberpath-db:
